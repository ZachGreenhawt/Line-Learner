<!doctype html>
<html>
  <head>
    <title>Your Script</title>
    <link rel="stylesheet" href="src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Manrope:wght@200..800&family=Teko:wght@300..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <main>
      <h1>Your Script</h1>
      <p id="out" role="status"></p>
    </main>
    <form id="form" enctype="multipart/form-data">
      <label for ="file">Upload Your Script (TXT or PDF):</label>
      <input type="file" id="file" name="user-file" accept=".pdf, .txt"></input>

      <fieldset>
        <legend>Settings</legend>
        <label>
          <input type="checkbox" name="includeStageDir" value="true"></input>
          Include stage directions in cues
        </label>
        <label>
          <input type="checkbox" name="caseSensitive" value="true"></input>
          Case sensitive answers
        </label>
        <label>
          <input type="checkbox" name="punctuation" value="true"></input>
          Keep punctuation
        </label>
        <label>
          <input type="checkbox" name="timedMode" value="true"></input>
          Timed mode
        </label>
      </fieldset>

      <button type="submit">Upload</button>
    </form>
    <section id="characters" hidden>
      <h2>Characters</h2>
      <textarea id="character-list" rows="8"></textarea>
      <button type="button" id="save-characters">Next</button>
    </section>
    <section id="start-line-section" hidden>
      <h2>Starting line</h2>
      <select id="start-line"></select>
      <button type="button" id="save-start-line">Next</button>
    </section>
    <section id="remove-lines-section" hidden>
      <h2>Remove lines</h2>
      <textarea id="remove-lines" rows="4"></textarea>
      <button type="button" id="save-remove-lines">Next</button>
    </section>
    <section id="parse-section" hidden>
      <h2>Parse</h2>
      <label for="target-character">Your character:</label>
      <select id="target-character"></select>
      <button type="button" id="parse">Parse script</button>
    </section>
    <section id="practice-section" hidden>
      <h2>Practice</h2>
      <p id="practice-count"></p>
      <p><strong>Cue:</strong></p>
      <blockquote id="practice-cue"></blockquote>
      <label for="practice-answer">Your line:</label>
      <textarea id="practice-answer" rows="4"></textarea>
      <button type="button" id="check-answer">Check</button>
      <button type="button" id="next-line">Next line</button>
      <p id="practice-feedback"></p>
      <details id="answer-details">
        <summary>Show answer</summary>
        <p id="expected-line"></p>
      </details>
    </section>
    <script type="module" src="/src/main.js">
    </script>
  
  </body>
</html>
