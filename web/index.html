<!doctype html>
<html>
  <head>
    <title>Your Script</title>
  </head>
  <body>
    <main>
      <h1>Your Script</h1>
      <pre id="out"></pre>
    </main>
    <form id="form" enctype="multipart/form-data">
      <label for ="file">Upload Your Script (TXT or PDF):</label>
      <input type="file" id="file" name="user-file" accept=".pdf, .txt"></input>

      <fieldset>
        <legend>Settings</legend>
        <label>
          <input type="checkbox" name="includeStageDir" value="true"></input>
          Include stage directions in cues
        </label>
        <label>
          <input type="checkbox" name="caseSensitive" value="true"></input>
          Case sensitive answers
        </label>
        <label>
          <input type="checkbox" name="punctuation" value="true"></input>
          Keep punctuation
        </label>
        <label>
          <input type="checkbox" name="timedMode" value="true"></input>
          Timed mode
        </label>
      </fieldset>

      <button type="submit">Upload</button>
    </form>
    <section id="characters" hidden>
      <h2>Characters</h2>
      <textarea id="character-list" rows="8"></textarea>
      <button type="button" id="save-characters">Save characters</button>
    </section>
    <section id="start-line-section" hidden>
      <h2>Starting line</h2>
      <select id="start-line"></select>
      <button type="button" id="save-start-line">Save starting line</button>
    </section>
    <section id="parse-section" hidden>
      <h2>Parse</h2>
      <label for="target-character">Your character:</label>
      <select id="target-character"></select>
      <button type="button" id="parse">Parse script</button>
    </section>
    <script type="module" src="/src/main.js">
    </script>
  
  </body>
</html>
